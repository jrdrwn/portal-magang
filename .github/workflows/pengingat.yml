name: Pengingat harian

# Memanggil /api/cron/pengingat setiap 15 menit pada 06:45–19:59 WIB (UTC+7).
# Atur secret repo: APP_URL (mis. https://magang.kantor.id) dan CRON_SECRET (sama dengan di server).
# Catatan: jadwal GitHub Actions bisa terlambat beberapa menit saat sibuk.
on:
  schedule:
    - cron: "*/15 23,0-12 * * *"
  workflow_dispatch:

jobs:
  kirim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Panggil endpoint pengingat
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL/CRON_SECRET belum diatur; lewati."
            exit 0
          fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/pengingat"
